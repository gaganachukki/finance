<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - STACKLY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
    <style>
        body {
            background-color: var(--background-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .error-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1;
            margin-bottom: 24px;
            text-shadow: 4px 4px 0px rgba(0, 168, 107, 0.2);
        }
        .error-title {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }
        .error-desc {
            color: var(--text-muted);
            max-width: 500px;
            margin-bottom: 32px;
            font-size: 1.1rem;
        }
        .error-actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
    <link rel="stylesheet" href="CSS/responsive.css">
</head>
<body>

    

    <div class="error-container fade-in">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">The page you are looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
        <div class="error-actions">
            <button onclick="history.back()" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Go Back</button>
            <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Back to Home</a>
        </div>
    </div>

    <script src="JS/script.js"></script>
    <script src="JS/mobile-nav.js"></script>
</body>
</html>
