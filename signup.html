<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - STACKLY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">
    <style>
        body {
            background-color: var(--background-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-container {
            

            width: 100%;
            max-width: 450px;
            padding: 24px;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .nav-brand {
            justify-content: center;
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            font-family: inherit;
            font-size: 1rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 42px;
            cursor: pointer;
            color: var(--text-muted);
        }
        .flex-between-login {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
        .back-home {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            font-weight: 500;
        }
        #loginError {
            color: #ef4444;
            font-size: 0.9rem;
            margin-bottom: 16px;
            display: none;
        }
    
        .role-selector {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        .role-btn {
            flex: 1;
            padding: 12px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius-md);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .role-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .role-btn.active {
            background: rgba(0, 168, 107, 0.1);
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

    </style>
    <link rel="stylesheet" href="CSS/responsive.css">
</head>
<body>
    


    <div class="login-container fade-in">
        <div class="login-card">
            <div class="login-header">
                <a href="index.html" class="nav-brand"><img src="assets/logos.webp" alt="STACKLY Logo" style="height: 36px; width: auto; object-fit: contain;"></a>
                <h2>Create an Account</h2>
                <p class="text-muted">Join STACKLY and take control of your future.</p>
            </div>
            
            <div class="role-selector" id="roleSelector">
                <button type="button" class="role-btn active" data-role="user">User</button>
                <button type="button" class="role-btn" data-role="admin">Admin</button>
            </div>
            
            <div id="loginError">Invalid email or password format.</div>
            
            <form id="loginForm">
                
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullname" required placeholder="John Doe" oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '')">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                    <i class="fa-solid fa-eye password-toggle" id="togglePassword"></i>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm_password" required placeholder="••••••••">
                </div>

                
                
                
                <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
            </form>
            
            <div style="text-align:center; margin-top:24px; font-size:0.95rem;">
                Already have an account? <a href="login.html" style="color:var(--primary-color); font-weight:600;">Log In</a>
            </div>
        </div>
        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </div>

    <script src="JS/script.js"></script>
    <script src="JS/signup.js"></script>
    <script src="JS/mobile-nav.js"></script>
</body>
</html>
